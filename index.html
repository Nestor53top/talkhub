<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>TalkHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div id="landing" class="screen active">
    <div class="landing-inner">
      <svg class="logo-svg" viewBox="0 0 48 48" width="64" height="64">
        <circle cx="24" cy="24" r="22" fill="none" stroke="#dc2626" stroke-width="2.5"/>
        <path d="M16 20c0-4 4-6 8-6s8 2 8 6" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
        <path d="M16 20v8c0 2 2 3 4 3h8c2 0 4-1 4-3v-8" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
        <path d="M21 25l3 3 3-3" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 22v6" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h1 class="logo-text">TalkHub</h1>
      <p class="subtitle">Защищённое P2P общение</p>
      <div class="landing-actions">
        <button class="btn primary" id="createRoomBtn">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Создать комнату
        </button>
        <div class="divider"><span>или</span></div>
        <div class="join-form">
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" class="input-icon"><circle cx="12" cy="8" r="4" fill="none" stroke="#666" stroke-width="2"/><path d="M4 22c0-6 4-10 8-10s8 4 8 10" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round"/></svg>
            <input type="text" id="joinName" placeholder="Ваш ник" maxlength="20" autocomplete="off">
          </div>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" class="input-icon"><path d="M7 9V5a5 5 0 0110 0v4M5 9h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2v-8a2 2 0 012-2z" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16" r="1" fill="#dc2626"/></svg>
            <input type="text" id="joinKey" placeholder="Ключ комнаты" maxlength="8" autocomplete="off">
          </div>
          <button class="btn secondary" id="joinRoomBtn">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 3h6v6M9 21H3v-6M21 3l-8 8M3 21l8-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Присоединиться
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="roomCreated" class="screen">
    <div class="created-header">
      <button class="icon-btn back-btn" id="backFromCreatedBtn">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 12H5M12 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="created-title">Комната создана</span>
    </div>
    <div class="created-body">
      <svg viewBox="0 0 24 24" width="48" height="48" class="key-icon"><path d="M7 9V5a5 5 0 0110 0v4M5 9h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2v-8a2 2 0 012-2z" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/><path d="M12 15v2" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/></svg>
      <p class="share-text">Отправьте этот ключ собеседнику:</p>
      <div class="key-display" id="roomKeyDisplay"></div>
      <button class="btn primary" id="copyKeyBtn">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="9" y="9" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        Скопировать ключ
      </button>
      <div class="waiting-area">
        <div class="pulse-dot"></div>
        <span class="waiting-text">Ожидание подключения...</span>
      </div>
    </div>
  </div>

  <div id="chat" class="screen">
    <div class="chat-header">
      <div class="room-info">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 9V5a5 5 0 0110 0v4M5 9h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2v-8a2 2 0 012-2z" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span id="chatRoomKey"></span>
      </div>
      <div class="connection-status" id="connectionStatus">
        <span class="status-dot"></span>
        Подключение...
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="chat-input-area">
      <div class="chat-controls">
        <button class="icon-btn" id="photoBtn" title="Отправить фото">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="13" r="4" fill="none" stroke="#888" stroke-width="1.8"/></svg>
        </button>
        <button class="icon-btn" id="fileBtn" title="Отправить файл">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round"/><path d="M14 2v6h6M12 18v-6M9 15l3-3 3 3" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="voiceBtn" title="Голосовой звонок">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.362 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0122 16.92z" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="videoBtn" title="Видеозвонок">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M23 7l-7 5 7 5V7z" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="1" y="5" width="15" height="14" rx="2" fill="none" stroke="#888" stroke-width="1.8"/></svg>
        </button>
      </div>
      <div class="message-input-row">
        <input type="text" id="messageInput" placeholder="Сообщение..." maxlength="500" autocomplete="off">
        <button class="btn send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="anyFileInput" style="display:none">
  </div>

  <div id="callOverlay" class="screen overlay" style="display:none">
    <div class="call-container">
      <div class="call-videos">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
      <div class="call-status-bar" id="callStatus">
        <span class="call-timer" id="callTimer">00:00</span>
      </div>
      <div class="call-controls">
        <button class="call-btn" id="toggleMic">
          <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 10v2a7 7 0 01-14 0v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 19v4M8 23h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Микрофон</span>
        </button>
        <button class="call-btn danger" id="endCallBtn">
          <svg viewBox="0 0 24 24" width="32" height="32"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.362 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0122 16.92z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Завершить</span>
        </button>
        <button class="call-btn" id="toggleCam">
          <svg viewBox="0 0 24 24" width="28" height="28"><path d="M23 7l-7 5 7 5V7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1" y="5" width="15" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span>Камера</span>
        </button>
      </div>
    </div>
  </div>

</div>

<svg style="display:none">
  <symbol id="icon-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
